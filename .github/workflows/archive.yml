name: Archive round trip

on: [push, pull_request]

permissions:
  contents: read

jobs:
  archive:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: python -m pip install meson ninja
      - name: Build
        run: |
          meson setup build
          meson compile -C build
      - name: Test archive creation
        run: python test/test_cli_create.py build/otezip${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Diagnose published Windows 0.5.0 binary
        if: runner.os == 'Windows'
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://github.com/trufae/otezip/releases/download/0.5.0/otezip-windows.exe', 'release.exe')"
          python test/test_cli_create.py release.exe
